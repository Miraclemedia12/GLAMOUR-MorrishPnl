<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Funds | GLAMOUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #e7c792 0%, #ba945d 100%); min-height: 100vh; color: #000; margin: 0; padding: 20px; padding-bottom: 40px; }
        .glass-card { background: #0a0a0a; border-radius: 28px; padding: 25px; color: white; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 20px; }
        .input-box { background: #151515; border: 1px solid #d4a017; border-radius: 16px; padding: 15px; width: 100%; color: white; font-size: 18px; font-weight: 700; outline: none; margin-top: 10px; }
        .withdraw-now-btn { background: linear-gradient(to bottom, #fff5c0, #f5c24c, #d4a017); color: #000; font-weight: 800; width: 100%; padding: 16px; border-radius: 16px; margin-top: 20px; font-size: 14px; text-transform: uppercase; border:none; cursor:pointer; }
        
        #receipt-view { display: none; background: white; color: #000; border-radius: 24px; padding: 30px; position: relative; }
        .status-approved { background: #e6fffa; color: #2d8a6e; padding: 6px 12px; border-radius: 50px; font-size: 10px; font-weight: 800; display: inline-block; }
        
        .history-card { background: #0a0a0a; border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 12px; }
        .history-item:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>

    <!-- Main Withdrawal Form -->
    <div id="withdrawal-form">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-black/20 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-sm"></i>
            </button>
            <h1 class="text-xl font-bold uppercase tracking-tighter">Withdraw Funds</h1>
        </div>

        <div class="glass-card">
            <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Total Wallet Balance</p>
            <h2 class="text-4xl font-extrabold text-amber-500 mt-1">₦14,000</h2>
            
            <div class="mt-8">
                <label class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Withdrawal Amount (Min ₦4,000)</label>
                <input type="number" id="withdraw-amount" class="input-box" placeholder="Minimum: ₦4,000" value="14000">
            </div>

            <div class="mt-6 p-4 bg-white/5 rounded-2xl border border-white/10">
                <p class="text-[9px] opacity-40 uppercase font-black tracking-widest">Destination Account</p>
                <p class="text-sm font-bold mt-1 text-white" id="bank-info">Loading...</p>
                <p class="text-[10px] opacity-50 font-medium" id="acc-info">---</p>
            </div>

            <button class="withdraw-now-btn" onclick="processWithdrawal()">
                <i class="fas fa-shield-check mr-2"></i> Confirm & Withdraw
            </button>
        </div>

        <!-- Transaction History -->
        <h3 class="text-[10px] font-bold uppercase opacity-50 mb-3 px-2 tracking-widest">Transaction History</h3>
        <div class="history-card">
            <div class="history-item">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-amber-500/10 flex items-center justify-center">
                        <i class="fas fa-gift text-amber-500 text-xs"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-bold text-white">Registration Cashback</p>
                        <p class="text-[9px] text-white/40">Bonus Awarded</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[11px] font-bold text-green-500">+₦14,000</p>
                    <p class="text-[8px] text-white/30 uppercase font-bold">Completed</p>
                </div>
            </div>
            <div id="new-history"></div>
        </div>
    </div>

    <!-- Approved Receipt View -->
    <div id="receipt-view" class="shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-2xl text-green-600"></i>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tighter">Approved</h1>
            <p class="text-[10px] font-bold opacity-40 uppercase tracking-widest mt-1">Glamour Payment Receipt</p>
        </div>

        <div class="space-y-4 border-t border-dashed border-gray-200 pt-6">
            <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-40 uppercase">Beneficiary</span> <span class="text-xs font-bold" id="r-name">---</span></div>
            <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-40 uppercase">Bank Name</span> <span class="text-xs font-bold" id="r-bank">---</span></div>
            <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-40 uppercase">Account No</span> <span class="text-xs font-bold" id="r-acc">---</span></div>
            <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-40 uppercase">Amount</span> <span class="text-sm font-black text-green-600" id="r-amt">---</span></div>
            <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-40 uppercase">Timestamp</span> <span class="text-xs font-bold" id="r-date">---</span></div>
            <div class="flex justify-between items-center border-t border-gray-100 pt-4"><span class="text-[10px] font-bold opacity-40 uppercase">Ref Number</span> <span class="text-[10px] font-bold tracking-tight" id="r-ref">---</span></div>
        </div>

        <button class="withdraw-now-btn !bg-black !text-white mt-8" onclick="window.print()">
            <i class="fas fa-print mr-2"></i> Print Official Receipt
        </button>
        <button class="w-full text-[10px] font-bold opacity-40 uppercase mt-4 tracking-widest" onclick="window.location.href='dashboard.html'">
            Return to Dashboard
        </button>
    </div>

    <script>
        window.onload = function() {
            const bank = localStorage.getItem('glamour_bank') || "Not Set";
            const acc = localStorage.getItem('glamour_acc_num') || "0000000000";
            const name = localStorage.getItem('glamour_acc_name') || "Valued Member";

            document.getElementById('bank-info').innerText = bank;
            document.getElementById('acc-info').innerText = acc + " | " + name;
        };

        function processWithdrawal() {
            const amount = document.getElementById('withdraw-amount').value;
            if(!amount || amount < 1000) {
                alert("Please enter a valid amount (Min ₦1,000)");
                return;
            }

            const now = new Date();
            document.getElementById('r-name').innerText = localStorage.getItem('glamour_acc_name') || "Member";
            document.getElementById('r-bank').innerText = localStorage.getItem('glamour_bank') || "Bank";
            document.getElementById('r-acc').innerText = localStorage.getItem('glamour_acc_num') || "0000000000";
            document.getElementById('r-amt').innerText = "₦" + Number(amount).toLocaleString();
            document.getElementById('r-date').innerText = now.toLocaleString();
            document.getElementById('r-ref').innerText = "GLM-" + Math.floor(Math.random() * 900000000 + 100000000);

            document.getElementById('withdrawal-form').style.display = 'none';
            document.getElementById('receipt-view').style.display = 'block';

            localStorage.setItem('has_withdrawn', 'true');
        }
    </script>
</body>
</html>
