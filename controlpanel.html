
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Glamour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        :root { --glamour-gold: #d4af37; --glamour-dark: #0a0a0a; --glamour-red: #ff4b4b; }
        body { 
            background: var(--glamour-dark); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 100%);
            min-height: 100vh;
        }
        .glass { background: rgba(255,255,255,0.02); border: 2px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(15px); }
        input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(212, 175, 55, 0.1) !important; color: white !important; transition: all 0.3s ease; }
        input:focus { border-color: var(--glamour-gold) !important; background: rgba(212, 175, 55, 0.08) !important; outline: none; }
        .hidden { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--glamour-gold); border-radius: 10px; }
        .glamour-btn { background: var(--glamour-gold); color: var(--glamour-dark); font-weight: 900; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: none; cursor: pointer; }
        .glamour-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .loader { width: 20px; height: 20px; border: 3px solid rgba(10, 10, 10, 0.3); border-top: 3px solid var(--glamour-dark); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* MODAL NOTIFICATION SYSTEM */
        #glamour-notifier {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; border-radius: 20px; background: #111;
            border: 1px solid var(--glamour-gold); z-index: 10000;
            display: flex; align-items: center; gap: 12px;
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        #glamour-notifier.show { top: 30px; }
        #glamour-notifier.error { border-color: var(--glamour-red); }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Custom Notification -->
    <div id="glamour-notifier">
        <i id="notifier-icon" class="fas fa-circle-check text-[#d4af37]"></i>
        <span id="notifier-text" class="text-xs font-bold uppercase tracking-widest">System Updated</span>
    </div>

    <div id="login-card" class="glass w-full max-w-sm rounded-[35px] p-10 text-center">
        <div class="mb-8 flex flex-col items-center">
            <img src="logo.png" alt="Logo" class="h-10 mb-4 brightness-0 invert opacity-80">
            <h1 class="text-2xl font-black text-[#d4af37] uppercase tracking-widest">Glamour Admin</h1>
        </div>
        <div class="space-y-4">
            <input type="text" id="user" placeholder="Username" class="w-full p-4 rounded-2xl outline-none">
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 rounded-2xl outline-none">
            <button onclick="handleLogin()" class="w-full glamour-btn p-4 rounded-2xl mt-4 shadow-xl uppercase">Authenticate</button>
        </div>
    </div>

    <div id="dash-card" class="glass w-full max-w-xl rounded-[35px] p-8 hidden">
        <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-4">
            <div>
                <h1 class="text-lg font-black text-[#d4af37] uppercase">Command Center</h1>
                <p class="text-[9px] text-white/40 font-bold uppercase tracking-widest">Global Account Management</p>
            </div>
        </div>
                
        <div class="space-y-6 max-h-[65vh] overflow-y-auto pr-3 custom-scrollbar">
            <div id="country-forms" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nigeria -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇳🇬 Nigeria</p>
                    <input type="text" id="ng-bank" placeholder="Bank" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ng-num" placeholder="Account No" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ng-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ng-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
                <!-- Ghana -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇬🇭 Ghana</p>
                    <input type="text" id="gh-bank" placeholder="Bank" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="gh-num" placeholder="Number" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="gh-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="gh-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
                <!-- South Africa -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇿🇦 South Africa</p>
                    <input type="text" id="sa-bank" placeholder="Bank" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="sa-num" placeholder="Account No" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="sa-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="sa-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
                <!-- Kenya -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇰🇪 Kenya</p>
                    <input type="text" id="ke-bank" placeholder="Method" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ke-num" placeholder="Number" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ke-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ke-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
                <!-- Uganda -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇺🇬 Uganda</p>
                    <input type="text" id="ug-bank" placeholder="Method" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ug-num" placeholder="Number" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ug-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="ug-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
                <!-- Cameroon -->
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] font-black text-[#d4af37] mb-3 uppercase tracking-widest">🇨🇲 Cameroon</p>
                    <input type="text" id="cm-bank" placeholder="Method" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="cm-num" placeholder="Number" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="cm-name" placeholder="Name" class="w-full p-2 mb-2 rounded-lg text-xs">
                    <input type="text" id="cm-amt" placeholder="Amount" class="w-full p-2 rounded-lg text-xs">
                </div>
            </div>

            <div class="p-6 rounded-3xl border border-white/5 bg-white/5">
                <p class="text-xs font-black text-white uppercase tracking-widest mb-4">Telegram Confirmation Link</p>
                <input type="text" id="link-in" class="w-full p-4 rounded-xl outline-none text-sm" placeholder="https://t.me/yourlink">
            </div>

            <button onclick="handleUpdate()" id="up-btn" class="w-full glamour-btn p-5 rounded-2xl shadow-2xl flex items-center justify-center gap-3">
                DEPLOY LIVE UPDATES
            </button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDjtqh_3ITTzXH2j16L13Xo7afDsVY7rFw",
  authDomain: "glamour-morrishpnl.firebaseapp.com",
  projectId: "glamour-morrishpnl",
  storageBucket: "glamour-morrishpnl.firebasestorage.app",
  messagingSenderId: "869550210573",
  appId: "1:869550210573:web:2dc8071908de4605095f44",
  measurementId: "G-3NTCVT48M8"
};
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const docRef = doc(db, "configs", "main");

    // Custom Notifier Function
    window.showGlamourNotification = (text, isError = false) => {
        const notifier = document.getElementById('glamour-notifier');
        const icon = document.getElementById('notifier-icon');
        const label = document.getElementById('notifier-text');
        
        label.innerText = text;
        if(isError) {
            notifier.classList.add('error');
            icon.className = "fas fa-triangle-exclamation text-[#ff4b4b]";
        } else {
            notifier.classList.remove('error');
            icon.className = "fas fa-circle-check text-[#d4af37]";
        }
        
        notifier.classList.add('show');
        setTimeout(() => notifier.classList.remove('show'), 3000);
    };

    window.handleLogin = () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "AdminMorrish" && p === "Glamour2026") {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('dash-card').classList.remove('hidden');
            initDash();
        } else { 
            showGlamourNotification("Unauthorized Access", true);
        }
    };

    async function initDash() {
        await signInAnonymously(auth);
        const snap = await getDoc(docRef);
        if(snap.exists()) {
            const d = snap.data();
            if(d.nigeria) {
                document.getElementById('ng-bank').value = d.nigeria.bank || "";
                document.getElementById('ng-num').value = d.nigeria.num || "";
                document.getElementById('ng-name').value = d.nigeria.name || "";
                document.getElementById('ng-amt').value = d.nigeria.amt || "";
            }
            if(d.ghana) {
                document.getElementById('gh-bank').value = d.ghana.bank || "";
                document.getElementById('gh-num').value = d.ghana.num || "";
                document.getElementById('gh-name').value = d.ghana.name || "";
                document.getElementById('gh-amt').value = d.ghana.amt || "";
            }
            if(d.south_africa) {
                document.getElementById('sa-bank').value = d.south_africa.bank || "";
                document.getElementById('sa-num').value = d.south_africa.num || "";
                document.getElementById('sa-name').value = d.south_africa.name || "";
                document.getElementById('sa-amt').value = d.south_africa.amt || "";
            }
            if(d.kenya) {
                document.getElementById('ke-bank').value = d.kenya.bank || "";
                document.getElementById('ke-num').value = d.kenya.num || "";
                document.getElementById('ke-name').value = d.kenya.name || "";
                document.getElementById('ke-amt').value = d.kenya.amt || "";
            }
            if(d.uganda) {
                document.getElementById('ug-bank').value = d.uganda.bank || "";
                document.getElementById('ug-num').value = d.uganda.num || "";
                document.getElementById('ug-name').value = d.uganda.name || "";
                document.getElementById('ug-amt').value = d.uganda.amt || "";
            }
            if(d.cameroon) {
                document.getElementById('cm-bank').value = d.cameroon.bank || "";
                document.getElementById('cm-num').value = d.cameroon.num || "";
                document.getElementById('cm-name').value = d.cameroon.name || "";
                document.getElementById('cm-amt').value = d.cameroon.amt || "";
            }
            document.getElementById('link-in').value = d.telegramLink || "";
        }
    }

    window.handleUpdate = async () => {
        const btn = document.getElementById('up-btn');
        btn.innerHTML = `<div class="loader"></div> SYNCING...`;
        btn.disabled = true;

        const updateObj = {
            nigeria: { bank: document.getElementById('ng-bank').value, num: document.getElementById('ng-num').value, name: document.getElementById('ng-name').value, amt: document.getElementById('ng-amt').value },
            ghana: { bank: document.getElementById('gh-bank').value, num: document.getElementById('gh-num').value, name: document.getElementById('gh-name').value, amt: document.getElementById('gh-amt').value },
            south_africa: { bank: document.getElementById('sa-bank').value, num: document.getElementById('sa-num').value, name: document.getElementById('sa-name').value, amt: document.getElementById('sa-amt').value },
            kenya: { bank: document.getElementById('ke-bank').value, num: document.getElementById('ke-num').value, name: document.getElementById('ke-name').value, amt: document.getElementById('ke-amt').value },
            uganda: { bank: document.getElementById('ug-bank').value, num: document.getElementById('ug-num').value, name: document.getElementById('ug-name').value, amt: document.getElementById('ug-amt').value },
            cameroon: { bank: document.getElementById('cm-bank').value, num: document.getElementById('cm-num').value, name: document.getElementById('cm-name').value, amt: document.getElementById('cm-amt').value },
            telegramLink: document.getElementById('link-in').value,
            lastUpdated: new Date().toLocaleTimeString()
        };

        try {
            await setDoc(docRef, updateObj, { merge: true });
            showGlamourNotification("Deployment Successful");
        } catch (e) { 
            showGlamourNotification("Sync Failed", true);
        }
        btn.innerHTML = "DEPLOY LIVE UPDATES";
        btn.disabled = false;
    };
</script>
</body>
</html>
