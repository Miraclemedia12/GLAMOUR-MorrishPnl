<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour | Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        :root { 
            --glamour-gold: #d4af37; 
            --glamour-dark: #050505; 
            --glamour-red: #ff4b4b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--glamour-dark); 
            background-image: 
                radial-gradient(circle at 50% 120%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 30%);
            color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        .login-card { width: 100%; max-width: 400px; text-align: center; }

        .logo-box {
            width: 85px; height: 85px; background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; font-size: 35px; color: var(--glamour-gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: rgba(212, 175, 55, 0.3); font-size: 14px; }
        
        .login-input {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 22px 22px 22px 60px; border-radius: 24px; color: #fff; font-weight: 600;
            outline: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px;
        }
        .login-input:focus { border-color: var(--glamour-gold); background: rgba(212, 175, 55, 0.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }

        .btn-login {
            width: 100%; background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%); color: #000;
            padding: 22px; border-radius: 24px; font-weight: 900; font-size: 14px;
            text-transform: uppercase; letter-spacing: 2px; margin-top: 10px;
            border: none; cursor: pointer; transition: 0.4s;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }
        .btn-login:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.3); }

        /* TOAST SYSTEM */
        #glamourToast {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; background: #0a0a0a;
            border: 1px solid var(--glamour-gold); border-radius: 25px;
            padding: 22px; z-index: 10000; transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #glamourToast.show { top: 30px; }
        #glamourToast.error { border-color: var(--glamour-red); }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--glamour-gold); width: 100%; border-radius: 0 0 25px 25px; }
        #glamourToast.error .toast-progress { background: var(--glamour-red); }
    </style>
</head>
<body>

    <div id="glamourToast">
        <div class="flex items-center gap-4">
            <div id="toastIconBg" class="w-12 h-12 rounded-2xl bg-[#d4af37]/10 flex items-center justify-center text-[#d4af37] border border-[#d4af37]/10">
                <i class="fas fa-shield-halved" id="toastIcon"></i>
            </div>
            <div>
                <b class="text-[10px] uppercase tracking-[3px] text-[#d4af37]" id="toastTitle">System Protocol</b>
                <p id="toastMsg" class="text-xs text-white/80 font-bold mt-1">Authenticating Identity...</p>
            </div>
        </div>
        <div id="toastBar" class="toast-progress"></div>
    </div>

    <div class="login-card">
        <div class="logo-box"><i class="fas fa-crown"></i></div>
        <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Glamour</h1>
        <p class="text-white/30 text-[10px] font-black uppercase tracking-[5px] mb-12">Executive Access Portal</p>

        <div class="input-group">
            <input type="email" id="email" class="login-input" placeholder="Registered Email">
            <i class="fas fa-user-shield"></i>
        </div>

        <div class="input-group">
            <input type="password" id="password" class="login-input" placeholder="Security Password">
            <i class="fas fa-key"></i>
        </div>

        <button onclick="handleLogin()" class="btn-login" id="loginBtn">Authorize Entry</button>

        <p class="mt-10 text-white/20 text-[10px] font-black tracking-widest uppercase">
            New to Glamour? <a href="register.html" class="text-[#d4af37] hover:opacity-80 transition">Create Account</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASDlQQMoXCeMZKs5O3KmO8zuFztt8rg2E",
            authDomain: "celeste-web1.firebaseapp.com",
            projectId: "celeste-web1",
            storageBucket: "celeste-web1.firebasestorage.app",
            messagingSenderId: "905722043319",
            appId: "1:905722043319:web:83d032bf3608b8957b2632"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.showGlamourAlert = (msg, type = 'info') => {
            const toast = document.getElementById('glamourToast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').innerText = msg;
            
            if(type === 'error') {
                toast.classList.add('error');
                icon.className = "fas fa-triangle-exclamation";
            } else {
                toast.classList.remove('error');
                icon.className = "fas fa-shield-check";
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        };

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if(!email || !password) { 
                showGlamourAlert("Credentials required", "error"); 
                return; 
            }

            btn.innerText = "AUTHENTICATING...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // CHECK PAYMENT STATUS
                const isPaid = localStorage.getItem(`paid_${user.uid}`);

                if (isPaid === "true") {
                    showGlamourAlert("Identity Verified. Loading Command Node...", "info");
                    setTimeout(() => window.location.href = 'main-dashboard.html', 1500);
                } else {
                    showGlamourAlert("Access Restricted. Verification Required.", "info");
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }

            } catch (error) {
                btn.innerText = "AUTHORIZE ENTRY";
                btn.style.opacity = "1";
                btn.disabled = false;
                showGlamourAlert("Security Protocol Refused Access", "error");
            }
        };
    </script>
</body>
</html>
